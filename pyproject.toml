[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openvoice4u"
version = "0.1.2"
description = "Local voice cloning, made simple."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = ["numpy==2.2.6", "soundfile==0.13.1", "psutil>=7,<8", "av==19.0.1"]

[project.optional-dependencies]
ml = ["qwen-tts==0.1.1", "torch==2.11.0", "torchaudio==2.11.0", "huggingface-hub==0.36.0"]
transcription = ["openai-whisper==20250625"]
test = ["pytest==8.4.2"]

[project.scripts]
openvoice4u = "app.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
