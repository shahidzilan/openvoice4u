name: Build Windows installer
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare CPU runtime dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install torch==2.11.0 torchaudio==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe -m pip install -r requirements-windows-cpu.lock.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe -m pip install --no-deps -e .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe -m pip check
      - run: .venv/Scripts/python.exe -m pytest -q
      - run: npm ci
      - run: .venv/Scripts/python.exe scripts/bundle_runtime.py
      - name: Check release version and content
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            python scripts/check_release.py $env:GITHUB_REF_NAME
          } else {
            python scripts/check_release.py
          }
      - name: Build installer
        run: npm run tauri -- build
      - name: Export source and checksums
        shell: pwsh
        run: |
          python scripts/export_source.py --output release-source
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $lines = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | ForEach-Object {
            "$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          $lines | Set-Content installer-SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: OpenVoice4U-Windows-x64
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            installer-SHA256SUMS.txt
            release-source/OpenVoice4U-source.zip
            release-runtime/dependency-inventory.json
  draft-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OpenVoice4U-Windows-x64
          path: release-assets
      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0)
          gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --draft --prerelease --title "OpenVoice4U $RELEASE_TAG" --notes "Windows x64 preview. Download the setup.exe asset. Models download separately in Settings. See README for hardware requirements and known long-form limitations. Review this draft before publishing."
