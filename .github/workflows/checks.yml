name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Python environment
        shell: pwsh
        run: |
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install torch==2.11.0 torchaudio==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe -m pip install -r requirements-windows-cpu.lock.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe -m pip install --no-deps -e .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe -m pip check
      - run: .venv/Scripts/python.exe -m pytest -q
      - run: npm ci
      - run: npm run build
      - run: python scripts/check_release.py
